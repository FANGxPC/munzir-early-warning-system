name: Munzir Early Warning Platform CI

on:
  push:
    branches: [ main, fang ]
  pull_request:
    branches: [ main, fang ]

jobs:
  test:
    name: Run Unit & Governance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Run Responsible AI Governance Scorecard
        run: |
          python -m prahari governance

      - name: Run Test Suites
        run: |
          pytest tests/test_responsible_ai_governance.py -v
          pytest tests/test_sentinel.py -v
          pytest tests/test_interop.py -v
          pytest tests/test_privacy.py tests/test_suppression.py -v
          pytest tests/ -q
