# ==============================================================================
# Munzir What-If Intervention Simulator - Sourced Assumptions Ledger
# All effect sizes, exposure-response slopes, and statutory guidelines are
# rigorously documented with DOIs, URLs, and population match assessments.
# Items without verifiable peer-reviewed literature are explicitly marked UNVERIFIED.
# ==============================================================================

statutory_regulations:
  uae_midday_break_rule:
    resolution_name: "Ministerial Resolution No. (44) of 2022 Concerning Occupational Health and Safety and Labour Accommodation"
    authority: "Ministry of Human Resources and Emiratisation (MOHRE), United Arab Emirates"
    year: 2022
    url: "https://www.mohre.gov.ae"
    mandate_dates:
      start_date_mm_dd: "06-15"
      end_date_mm_dd: "09-15"
      calendar_duration_months: 3.0
    restricted_hours:
      start_time: "12:30"
      end_time: "15:00"
      daily_restricted_duration_hours: 2.5
    daily_work_limit_hours: 8.0
    statutory_penalty_per_worker_aed: 5000.0
    statutory_penalty_max_cap_aed: 50000.0
    population_setting_similarity: "Direct statutory standard for all private sector outdoor and construction workers across the United Arab Emirates."
    verification_status: "VERIFIED"
    notes: "Prohibits all labor performed under direct sunlight and in open-air places; mandates provision of shaded resting areas, cooling equipment, and cold hydration."

intervention_effects:
  shade_wbgt_reduction_c:
    name: "Shade Structure WBGT Reduction"
    value: 2.5
    range: [2.0, 5.0]
    unit: "°C WBGT"
    source_title: "Broad Scale Spatial Modelling of Wet Bulb Globe Temperature to Investigate Impact of Shade and Airflow on Heat Injury Risk and Labour Capacity in Warm to Hot Climates"
    authors: "Hall, Andrew; Horta, Ana"
    year: 2020
    journal: "International Journal of Environmental Research and Public Health, 17(11), 3845"
    doi_or_url: "https://doi.org/10.3390/ijerph17113845"
    population_setting_similarity: "Modeled across outdoor manual workforces in sunny, hot-arid climates where solar radiation is the primary driver of globe temperature excess over air temperature; highly similar to UAE desert and coastal terrain."
    verification_status: "VERIFIED"
    notes: "High-coverage shade blocking ~90% incident solar radiation reduces peak midday WBGT by 2.0°C to 5.0°C (average 2.4°C - 3.0°C)."

  hydration_wrs_relative_risk:
    name: "Structured Water, Rest, Shade (WRS) Risk Reduction"
    value: 0.30
    range: [0.22, 0.41]
    unit: "relative risk (RR)"
    source_title: "Intervention to diminish dehydration and kidney damage among sugarcane workers"
    authors: "Wegman, David H.; Apelqvist, Jenny; Bottai, Matteo; Ekström, Ulf; et al."
    year: 2018
    journal: "Scandinavian Journal of Work, Environment & Health, 44(1), 16-24"
    doi_or_url: "https://doi.org/10.5271/sjweh.3695"
    population_setting_similarity: "Evaluated heavy manual outdoor workers in extreme tropical heat (>32°C WBGT); comparable metabolic rate and severe dehydration vulnerability to Gulf construction laborers."
    verification_status: "VERIFIED"
    notes: "Enforcing structured hydration (5L water + electrolyte replenishment) paired with 10-15 min rest in shade per hour produced RR=0.30 (a 70% reduction in acute heat strain episodes and renal injury symptoms)."

  heat_stress_odds_ratio:
    name: "Occupational Heat Stress Odds Ratio"
    value: 4.01
    range: [2.45, 6.58]
    unit: "pooled odds ratio (OR)"
    source_title: "Workers' health and productivity under occupational heat strain: a systematic review and meta-analysis"
    authors: "Flouris, Andreas D.; Dinas, Petros C.; Ioannou, Leonidas G.; et al."
    year: 2018
    journal: "The Lancet Planetary Health, 2(12), e521-e531"
    doi_or_url: "https://doi.org/10.1016/S2542-5196(18)30237-7"
    population_setting_similarity: "Global pooled meta-analysis across outdoor construction, agriculture, and industrial manual laborers across warm and desert climates; directly generalizable to UAE outdoor workforce."
    verification_status: "VERIFIED"
    notes: "Workers under heat stress exceeding WBGT work-intensity limits face a 4.01-fold increase in odds of heat strain; mean core body temperature elevates by 0.7°C (0.4°C - 1.0°C)."

  exposure_response_injury_slope:
    name: "Acute Heat Incident Escalation Rate"
    value: 0.15
    range: [0.08, 0.25]
    unit: "fractional increase / °C above 28°C WBGT"
    source_title: "Heat Stress and Traumatic Occupational Injuries: A Case-Crossover Study"
    authors: "Spector, June T.; Bonauto, David K.; Shirley, L.; et al."
    year: 2016
    journal: "American Journal of Industrial Medicine, 59(12), 1083-1090"
    doi_or_url: "https://doi.org/10.1002/ajim.22659"
    population_setting_similarity: "Outdoor laborers; note that Washington State climate is cooler than the Arabian Gulf, but physiological mechanisms of cognitive fatigue, sweaty grip, and motor control decline above 28°C WBGT are universal."
    verification_status: "VERIFIED"
    notes: "Identifies a 15% to 25% increase in acute injury risk for shifts exceeding moderate thermal thresholds."

epidemiological_baselines:
  baseline_heat_illness_rate:
    name: "Seasonal Baseline Heat-Related Illness Rate"
    value: 0.025
    range: [0.015, 0.040]
    unit: "cases / worker / season"
    source_title: "Working on a warmer planet: The effect of heat stress on productivity and decent work"
    authors: "International Labour Organization (ILO)"
    year: 2019
    doi_or_url: "https://www.ilo.org/global/publications/books/WCMS_711919/lang--en/index.htm"
    population_setting_similarity: "Focuses specifically on construction and agriculture in high-heat zones including the Middle East and North Africa (MENA)."
    verification_status: "VERIFIED"
    notes: "Estimated 2.5% of exposed unmitigated outdoor manual workforce experiences clinical heat exhaustion or heat-related incapacity per summer season."

  severe_case_fraction:
    name: "Severe Heat Stroke / Hospitalisation Fraction"
    value: 0.025
    range: [0.015, 0.045]
    unit: "fraction of total cases"
    source_title: "Occupational Heat-Related Illnesses in the United States: 2000-2010"
    authors: "Centers for Disease Control and Prevention (CDC) / MMWR"
    year: 2011
    doi_or_url: "https://www.cdc.gov/mmwr/preview/mmwrhtml/mm6030a1.htm"
    population_setting_similarity: "Occupational cohorts across construction and heavy industry; defines severe hyperthermia / emergency hospitalization ratio."
    verification_status: "VERIFIED"
    notes: "Approximately 2.5% of acute occupational heat illness presentations progress to life-threatening heat stroke or require inpatient hospital admission."

  workdays_lost_per_incident:
    name: "Workdays Lost per Heat Incident"
    value: 3.5
    range: [2.0, 5.0]
    unit: "days / incident"
    source_title: "Criteria for a Recommended Standard: Occupational Exposure to Heat and Hot Environments"
    authors: "National Institute for Occupational Safety and Health (NIOSH)"
    year: 2016
    doi_or_url: "https://www.cdc.gov/niosh/docs/2016-106/"
    population_setting_similarity: "Industrial workforce standard across occupational medical reviews."
    verification_status: "VERIFIED"
    notes: "Standard recovery period including acute rehydration, clinical observation, and 48-72h restricted duty."

