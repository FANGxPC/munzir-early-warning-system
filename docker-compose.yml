version: "3.8"

services:
  munzir:
    build:
      context: .
      dockerfile: Dockerfile
    image: munzir:latest
    container_name: munzir-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MUNZIR_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/feeds')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
